<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>小时数时区转换</title>
</head>
<body>
<script>
  // -------------------- UTC → Local --------------------
  function utcHourToLocal(utcHour) {
    var offsetMinutes = new Date().getTimezoneOffset(); // 当前时区与 UTC 的分钟差
    var offsetHours = -offsetMinutes / 60;
    var localHour = (utcHour + offsetHours + 24) % 24;
    return Math.floor(localHour);
  }

  // -------------------- Local → UTC --------------------
  function localHourToUTC(localHour) {
    var offsetMinutes = new Date().getTimezoneOffset();
    var offsetHours = -offsetMinutes / 60;
    var utcHour = (localHour - offsetHours + 24) % 24;
    return Math.floor(utcHour);
  }

  // -------------------- 测试 --------------------
  console.log('UTC 11 -> 本地', utcHourToLocal(11));
  console.log('本地 19 -> UTC', localHourToUTC(19));

  // 测试所有小时映射
  for (var i = 0; i < 24; i++) {
    var local = utcHourToLocal(i);
    var backUTC = localHourToUTC(local);
    console.log('UTC', i, '-> Local', local, '-> UTC back', backUTC);
  }
</script>
</body>
</html>
